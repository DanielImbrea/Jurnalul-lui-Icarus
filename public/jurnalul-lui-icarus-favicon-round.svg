<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" role="img" aria-label="Jurnalul lui Icarus" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#242019"/>
      <stop offset="100%" stop-color="#171512"/>
    </radialGradient>
    <radialGradient id="maroonG" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7A2438"/>
      <stop offset="100%" stop-color="#3B0F1B"/>
    </radialGradient>
    <radialGradient id="goldG" cx="65%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F0D9A0"/>
      <stop offset="100%" stop-color="#B8933F"/>
    </radialGradient>
    <radialGradient id="lensG" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="100%" stop-color="#D9BD7A"/>
    </radialGradient>
  </defs>

  <!-- round background, transparent outside -->
  <circle cx="48" cy="48" r="46" fill="url(#bgGlow)"/>

  <!-- seal ring -->
  <circle cx="48" cy="48" r="44" fill="none" stroke="#C9A46A" stroke-width="0.8" opacity="0.55"/>

  <!-- two states -->
  <circle cx="36" cy="48" r="26" fill="url(#maroonG)"/>
  <circle cx="60" cy="48" r="26" fill="url(#goldG)"/>

  <!-- where they meet -->
  <path d="M48 24.93 A26 26 0 0 1 48 71.07 A26 26 0 0 1 48 24.93 Z" fill="url(#lensG)"/>

  <!-- fine edge definition -->
  <circle cx="36" cy="48" r="26" fill="none" stroke="#241016" stroke-width="0.35" opacity="0.5"/>
  <circle cx="60" cy="48" r="26" fill="none" stroke="#241016" stroke-width="0.35" opacity="0.35"/>
</svg>
